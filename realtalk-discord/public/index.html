<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real Talk</title>
<script src="app.js"></script>

<style>
:root{--bg:#faf6f0;--fg:#2b2320;--mut:#7a6d66;--card:#fff;--acc:#e0613d;--line:#e8dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1715;--fg:#f4ece4;--mut:#a89a90;--card:#272220;--acc:#f07a56;--line:#3a332f}}
:root[data-theme="dark"]{--bg:#1b1715;--fg:#f4ece4;--mut:#a89a90;--card:#272220;--acc:#f07a56;--line:#3a332f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
button{font:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:20px}
h1{font-size:34px;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 20px;line-height:1.4;font-family:system-ui,sans-serif;font-size:15px}
.lbl{font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--fg)}
.cat b{display:block;font-size:17px}.cat span{font:13px system-ui,sans-serif;color:var(--mut)}
.cat.on{border-color:var(--acc)}
input{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:16px system-ui,sans-serif}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:14px system-ui,sans-serif}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:16px;font-size:18px;width:100%;margin-top:auto}
.btn.ghost{background:none;color:var(--mut);border:0;font:14px system-ui,sans-serif;margin-top:8px;padding:8px}
.top{display:flex;justify-content:space-between;align-items:center;font:14px system-ui,sans-serif;color:var(--mut)}
.top button{background:none;border:0;color:var(--mut);padding:4px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 24px;min-height:300px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.08);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tag{font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:16px}
.q{font-size:26px;line-height:1.3;margin:0}
.turn{text-align:center;font:15px system-ui,sans-serif;color:var(--mut);margin:18px 0 0;min-height:22px}
.turn b{color:var(--fg)}
.note{text-align:center;font:13px system-ui,sans-serif;color:var(--mut);margin:12px 0}
.hide{display:none}

.row{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font:14px/1.35 system-ui,sans-serif}
.row span{flex:1}.row select{font:12px system-ui;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:2px}
.row button{background:none;border:0;color:var(--mut);font-size:16px}
textarea{width:100%;min-height:80px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:15px system-ui,sans-serif}
.sm{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:15px system-ui,sans-serif;width:100%;margin-top:8px}
.code{font:700 40px system-ui;letter-spacing:.2em;text-align:center;color:var(--acc);margin:6px 0}
.scroll{overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.dn{color:var(--acc)}
.tools{display:flex;gap:8px;justify-content:center;margin:10px 0 0}
.tools button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:99px;padding:8px 14px;font:14px system-ui,sans-serif}
.deep{font-size:18px;font-style:italic;color:var(--acc);text-align:center;margin:14px 8px 0;animation:in .3s}
.hint{font:13px system-ui,sans-serif;color:var(--mut);text-align:center;margin:6px 0}
@media (min-width:700px){#app{max-width:760px}.q{font-size:36px}.card{min-height:380px;padding:48px 40px}.tools button{font-size:15px}.btn{font-size:20px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATS={light:"Light",deep:"Deep",us:"About Us",wild:"Would You Rather"};
const SEED={"light": ["What's a weirdly specific thing that instantly puts you in a good mood?", "What's the most useless talent you have?", "If you could only eat one meal for the rest of your life, what is it?", "What was your most embarrassing moment that you can laugh about now?", "Which of us would survive longest in a zombie apocalypse, and why?", "What's the best trip you've ever taken?", "What's a small thing someone did for you that you never forgot?", "Do you think people more or less project what is already inside of them?", "Why do you think I'm still single?", "Where does your happiness come from?", "If your kid grew up exactly like one person in the group, who would you not want it to be?", "If your whole group got stuck in the wilderness, who would be the first person to be eaten?", "Who has the craziest lore?", "What's the best unplanned night you've had?", "What's my red flag?", "What's my green flag?", "What's a small moment that changed the way you see someone?", "What's something you hope you never grow out of?", "What's a little thing someone did for you that you've never forgotten?", "What would your friends say is your most predictable habit?", "Do you miss the boundless wonder you had as a child?", "Do you know who you are?", "What's a little thing I do that always makes you smile, no matter what?", "What's something about you that hasn't changed since childhood?"], "deep": ["What's something you believe now that you didn't five years ago?", "When do you feel most like yourself?", "What are you most afraid people will find out about you?", "What's a decision you still wonder about?", "What does a really good life look like to you?", "What's something you wish you could tell your younger self?", "What's one thing you've never been able to forgive yourself for?", "What do you need more of in your life right now?", "Who has shaped you the most, and how?", "What are you proud of that nobody knows about?", "How has your definition of happiness changed over the course of your life?", "Do you think it's more important to live in the moment or sacrifice the present for a better tomorrow?", "What's a regret you have?", "If your life had credits, which scenes would play first?", "Who in the group would you trust your life with but not your secrets?", "What's something you're afraid of?", "What change scares you the most?", "Are you scared of aging or are you just scared to accept that this was the only childhood you get?", "If you could be granted one wish, what would it be?", "What's something you wished people asked you about more often?", "What's a belief you've changed your mind about?", "What would your younger self be surprised to learn about your life now?", "What's a dream you haven't said out loud yet?", "Who do you NEED to be? And what do you WANT to be?", "Do you ever think you'll look back one day and regret all the time you wasted?", "Home is where the ___ is."], "us": ["What's something you admire about each person in this room?", "What's something about me you think I don't know you've noticed?", "What's your favourite memory that involves all of us?", "What's one thing you'd want us to do together before the year ends?", "What do you think I'm secretly really good at?", "What's something you've been wanting to ask me but never did?", "What's your best memory of me?", "What's a random detail about me you love, that you bet I don't even notice?", "What's the weirdest thought you've had about me but never shared?", "What's a rumor about me you'd believe immediately?", "When have you felt most proud of me?", "What's something I do that lowkey worries you about me?", "What's something about me you hope never changes?", "What's one quality you see in me that you wish you had?", "If you could ask me two questions, and I can't lie, what would you ask?"], "wild": ["Would you rather know how you die or when you die?", "Would you rather relive your best day on loop or see your future?", "Would you rather be famous for something bad or unknown for something great?", "Would you rather lose all your photos or all your memories of the last 5 years?", "Would you rather always say what you think or never speak again?", "Would you rather have unlimited money or unlimited time?", "Would you rather live 200 years in this world or 20 in a perfect one?", "Would you rather read minds or be invisible?", "Would you rather have the ability to change the past or see into the future?", "Would you rather be able to see all the positive or all the negative effects your actions have had on others?"]};
function auto(q){const t=q.toLowerCase();
 if(/would you rather|or would you|\bversus\b|\bvs\b/.test(t))return"wild";
 if(/\b(me|us|we|our|each other|everyone here|this room|friends?)\b/.test(t)&&/\b(you|your)\b|\bI\b|\bme\b/i.test(q)&&/\b(me|us|each other|this room|all of us|we)\b/.test(t))return"us";
 if(/afraid|fear|forgive|regret|believe|proud|truth|secret|lonely|love|death|die|meaning|purpose|younger self|shaped|change[d]? you|hurt|grief|insecur|ashamed|dream|life|struggl|need|wish/.test(t))return"deep";
 return"light"}
const TAGS={...CATS,close:"One more question"};
const CLOSERS=["What's something you appreciated about tonight?","What's one thing you learned about someone here tonight?","What moment tonight are you taking with you?","What's one word for how you feel right now?","Who made you laugh the most tonight, and why?","What's something you're looking forward to, big or small?"];
const FOLLOW=["What made that stick with you?","When did you first realise that?","Has that always been true for you?","Who else knows that about you?","What would change if that were different?","How does that show up in your daily life?","What would you tell someone going through the same thing?"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const follow=(q,n)=>FOLLOW[((n||0)*7+q.length)%FOLLOW.length];
let favs=[];try{favs=JSON.parse(localStorage.getItem("rt_fav")||"[]")}catch(e){}if(!Array.isArray(favs))favs=[];
const isFav=q=>favs.some(f=>f.q===q);
function togFav(c){if(isFav(c.q))favs=favs.filter(f=>f.q!==c.q);else favs.push({k:c.k,q:c.q});try{localStorage.setItem("rt_fav",JSON.stringify(favs))}catch(e){}}
const getSess=()=>{try{const x=JSON.parse(localStorage.getItem("rt_sess")||"null");return x&&x.deck&&x.i<x.deck.length?x:null}catch(e){return null}};
const putSess=o=>{try{localStorage.setItem("rt_sess",JSON.stringify(o))}catch(e){}};
const delSess=()=>{try{localStorage.removeItem("rt_sess")}catch(e){}};
let cards=[];
try{cards=JSON.parse(localStorage.getItem("rt_cards2")||"null")}catch(e){}
if(!Array.isArray(cards)||!cards.length)reset();
function reset(){cards=Object.entries(SEED).flatMap(([k,a])=>a.map(q=>({k,q})));save()}
function save(){try{localStorage.setItem("rt_cards2",JSON.stringify(cards))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S={sel:new Set(["light","deep","us","wild"]),names:[],deck:[],i:0,t:0};
let room=null,R=null,G=null,me={name:"",host:false,code:""},unsub=[];
async function initRoom(){if(window.discordReady){await window.discordReady;return window.DISCORD_ROOM}return null}
(async()=>{try{room=await initRoom()}catch(e){}if($('#grp'))home()})();
function head(back,title){return `<div class="top"><button id="bk">${back}</button><span>${title||''}</span></div>`}

function home(){
 const n=k=>cards.filter(c=>c.k===k).length;
 $('#app').innerHTML=`<h1>Real Talk</h1>
 <p class="sub">Questions on cards. Answer out loud — in person or on a call. No typing, no texting.</p>
 <div class="lbl">Decks</div>
 <div class="cats">${Object.entries(CATS).map(([k,d])=>`<button class="cat ${S.sel.has(k)?'on':''}" data-k="${k}"><b>${d}</b><span>${n(k)} cards</span></button>`).join('')}</div>
 <button class="sm" id="ed">✏️ See & edit all ${cards.length} cards</button>
 <button class="sm" id="fv0">♥ Favorites (${favs.length})</button>
 ${getSess()?`<button class="sm" id="rs2">↩ Resume your last night · card ${getSess().i+1} of ${getSess().deck.length}</button>`:''}
 <div class="lbl">Play</div>
 <div class="names">${S.names.map((x,i)=>`<span class="chip" data-i="${i}">${esc(x)} ✕</span>`).join('')}</div>
 <input id="nm" placeholder="Same room: add player names (optional)" autocomplete="off" style="margin-top:8px">
 <div style="height:12px"></div>
 <button class="btn" id="go" style="margin-top:0">Play on this phone</button>
 <div id="grp" ${room?'':'class="hide"'}>
 <div class="lbl">On a call? Everyone gets the card</div>
 <button class="sm" id="host" style="margin-top:0">Host a group</button>
 <button class="sm" id="join">Join a group</button></div>`;
 document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.sel.has(k)?S.sel.delete(k):S.sel.add(k);home()});
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.names.splice(+c.dataset.i,1);home()});
 $('#nm').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){S.names.push(e.target.value.trim());home();$('#nm').focus()}};
 $('#go').onclick=()=>{if(buildDeck())playLocal()};
 $('#ed').onclick=editor;$('#fv0').onclick=favScreen;
 if($('#rs2'))$('#rs2').onclick=()=>{const x=getSess();if(x.mode==='group')lobby(true,true);else{S.deck=x.deck;S.i=x.i;S.t=x.t||0;S.names=x.names||[];S.close=null;S.deeper=false;playLocal()}};
 $('#host').onclick=()=>lobby(true);$('#join').onclick=()=>lobby(false);
}
function buildDeck(){const d=cards.filter(c=>S.sel.has(c.k));if(!d.length){alert("Pick a deck with cards in it.");return false}
 S.deck=shuffle([...d]);S.i=0;S.close=null;S.deeper=false;S.t=Math.floor(Math.random()*Math.max(S.names.length,1));return true}

function editor(){
 const draw=()=>{
 $('#app').innerHTML=head('← Back',cards.length+' cards')+`
 <div class="scroll">
 <div class="lbl">Add cards (one per line — I'll sort them)</div>
 <textarea id="add" placeholder="What's your biggest fear?\nWould you rather..."></textarea>
 <button class="sm" id="addb">Add & auto-sort</button>
 ${Object.entries(CATS).map(([k,d])=>{const l=cards.map((c,i)=>({...c,i})).filter(c=>c.k===k);return `<div class="lbl">${d} · ${l.length}</div>`+l.map(c=>`<div class="row"><span>${esc(c.q)}</span><select data-i="${c.i}">${Object.entries(CATS).map(([a,b])=>`<option value="${a}" ${a===k?'selected':''}>${b}</option>`).join('')}</select><button data-d="${c.i}" title="Remove">✕</button></div>`).join('')}).join('')}
 <button class="sm" id="rs">Restore original cards</button><div style="height:20px"></div></div>`;
 $('#bk').onclick=home;
 $('#addb').onclick=()=>{const L=$('#add').value.split('\n').map(x=>x.trim()).filter(Boolean);L.forEach(q=>cards.push({k:auto(q),q}));save();draw()};
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{cards.splice(+b.dataset.d,1);save();draw()});
 document.querySelectorAll('select[data-i]').forEach(s=>s.onchange=()=>{cards[+s.dataset.i].k=s.value;save();draw()});
 $('#rs').onclick=()=>{if(confirm("Replace your list with the original cards?")){reset();draw()}};
 };draw();
}

function favScreen(){
 $('#app').innerHTML=head('← Back','Favorites')+`<div class="scroll">${favs.length?favs.map((c,i)=>`<div class="row"><span>${esc(c.q)}</span><button data-d="${i}">✕</button></div>`).join(''):'<p class="sub">Tap ♡ on any card to save it here.</p>'}</div>${favs.length?'<button class="btn" id="pf">Play favorites</button>':''}`;
 $('#bk').onclick=home;
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{favs.splice(+b.dataset.d,1);try{localStorage.setItem("rt_fav",JSON.stringify(favs))}catch(e){}favScreen()});
 if($('#pf'))$('#pf').onclick=()=>{S.deck=shuffle([...favs]);S.i=0;S.t=0;S.close=null;S.deeper=false;S.pickName=null;playLocal()};
}
function toolsHTML(c,deeper){return `<div class="tools"><button id="dp">${deeper?'Hide':'Go deeper'}</button><button id="fv">${isFav(c.q)?'♥ Saved':'♡ Save'}</button></div>`}
function cardHTML(c,who,deeper,n){return `<div class="stage"><div class="card"><div class="tag">${TAGS[c.k]||''}</div><p class="q">${esc(c.q)}</p></div>${c.k==='close'?'':toolsHTML(c,deeper)}${deeper&&c.k!=='close'?`<p class="deep">↳ ${esc(follow(c.q,n))}</p>`:''}<p class="turn">${who||''}</p></div><p class="note">Answer out loud. Look at each other, not the screen.</p>`}
function playLocal(){
 if(!S.close&&S.i>=S.deck.length)return endScreen();
 const c=S.close||S.deck[S.i],n=S.names.length;
 const who=S.close?'Everyone, one last one':S.pickName?`🎲 <b>${esc(S.pickName)}</b> answers first`:n?`<b>${esc(S.names[S.t%n])}</b> answers first`:'Go around the circle';
 if(!S.close)putSess({mode:'local',deck:S.deck,i:S.i,t:S.t,names:S.names});
 $('#app').innerHTML=head('← Exit',S.close?'Last card':`${S.i+1} / ${S.deck.length}`)+cardHTML(c,who,S.deeper,S.i)+`${!S.close&&n>1?'<button class="sm" id="rp" style="margin-top:0;margin-bottom:8px">🎲 Pick who goes first</button>':''}<button class="btn" id="nx" style="margin-top:0">${S.close?'Finish the night':"Everyone's answered →"}</button>${S.close?'':'<button class="btn ghost" id="sk">Not tonight — different card</button><button class="btn ghost" id="en" style="margin-top:0">End the night with one more question</button>'}`;
 $('#bk').onclick=home;
 if($('#rp'))$('#rp').onclick=()=>{const o=S.names.filter(x=>x!==S.pickName);S.pickName=pick(o);playLocal()};
 $('#dp').onclick=()=>{S.deeper=!S.deeper;playLocal()};
 if($('#fv'))$('#fv').onclick=()=>{togFav(c);playLocal()};
 $('#nx').onclick=()=>{if(S.close)return endScreen();S.i++;S.t++;S.deeper=false;S.pickName=null;playLocal()};
 if($('#sk'))$('#sk').onclick=()=>{S.deck.push(S.deck.splice(S.i,1)[0]);S.deeper=false;S.pickName=null;playLocal()};
 if($('#en'))$('#en').onclick=()=>{S.close={k:'close',q:pick(CLOSERS)};playLocal()};
}
function endScreen(){delSess();$('#app').innerHTML=`<div class="stage" style="text-align:center"><h1>Good night 🌙</h1><p class="sub">Hopefully you learned something new about each other.</p></div><button class="btn ghost" id="hm">Back home</button>`;$('#hm').onclick=()=>{leave();home()}}

// ---------- group play ----------
function lobby(host,resume){
 me.host=host;
 const code=window.DISCORD?DISCORD.code:(host?Math.random().toString(36).slice(2,6).toUpperCase().replace(/[^A-Z0-9]/g,'X'):'');
 $('#app').innerHTML=head('← Back',host?'Host a group':'Join a group')+`<div class="stage">
 <p class="sub">${host?'Your friends open this same app and tap “Join a group” with your code.':'Ask the host for the 4-letter code.'}</p>
 ${host?`<div class="code">${code}</div>`:`<input id="cd" maxlength="4" placeholder="CODE" style="text-transform:uppercase;text-align:center;font-size:24px;letter-spacing:.2em;margin-bottom:10px">`}
 <input id="me" placeholder="Your name" autocomplete="off" maxlength="20"></div>
 <button class="btn" id="enter" style="margin-top:0">${host?'Open group':'Join'}</button><p class="note" id="err"></p>`;
 $('#bk').onclick=home;
 $('#enter').onclick=async()=>{
  const nm=$('#me').value.trim(),c=host?code:$('#cd').value.trim().toUpperCase();
  if(!nm||c.length<4){$('#err').textContent="Add your name"+(host?"":" and the code");return}
  me.name=nm;me.code=c;$('#err').textContent="Connecting…";
  try{R=await room.join(window.DISCORD?DISCORD.instance:"rt-"+c.toLowerCase(),host)}catch(e){$('#err').textContent="Couldn't connect ("+(e.code||'error')+"). Check the code and your connection.";return}
  unsub.push(R.on("state",m=>{if(m.isMe)return;G=m.data;groupView()}));
  unsub.push(R.onPeers(()=>groupView()));
  if(host){unsub.push(R.on("hello",()=>pushState()));const x=resume&&getSess();
   if(x){S.deck=x.deck;S.i=x.i}else{S.deck=shuffle([...cards.filter(c=>S.sel.has(c.k))]);if(!S.deck.length)S.deck=shuffle([...cards]);S.i=0}
   S.n=0;lastN=-1;G={lobby:true,n:0};pushState();}
  else{R.emit("hello",{}).catch(()=>{});setTimeout(()=>{if(!G)groupView()},300)}
  R.presence({name:nm,done:false,pass:false,host});
  groupView();
 };
 if(window.DISCORD){$('#me').value=DISCORD.name;if($('#cd'))$('#cd').value=DISCORD.code;$('#enter').click();}
}
function setG(close){S.n=(S.n||0)+1;const c=close?{k:'close',q:pick(CLOSERS)}:S.deck[S.i];
 G=c?{n:S.n,i:S.i,total:S.deck.length,k:c.k,q:c.q}:{n:S.n,end:true};
 if(!close&&c)putSess({mode:'group',deck:S.deck,i:S.i});if(G.end)delSess();
 pushState();groupView()}
function pushState(){if(R&&G)R.emit("state",G).catch(()=>{})}
function leave(){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];if(R){try{R.leave()}catch(e){}}R=null;G=null}
let lastN=-1,gDeep=false;
function groupView(){
 if(!R)return;
 const peers=R.peers().filter(p=>p.presence&&p.presence.name);
 if(G&&G.n!==lastN){lastN=G.n;gDeep=false;R.presence({done:false,pass:false}).catch(()=>{})}
 const done=peers.filter(p=>p.presence.done).length;
 const chips=peers.map(p=>`<span class="chip ${p.presence.done&&G&&!G.lobby?'dn':''}">${esc(p.presence.name)}${p.isMe?' (you)':''}${p.presence.host?' ★':''}${p.presence.done&&G&&!G.lobby?' ✓':''}</span>`).join('');
 const mp=peers.find(p=>p.isMe),mine=mp&&mp.presence.done,passed=mp&&mp.presence.pass;
 const wantSwap=peers.some(p=>!p.isMe&&p.presence.pass);
 let body='',acts='';
 if(!G)body=`<div class="stage"><p class="sub" style="text-align:center">Connecting to the group…</p></div>`;
 else if(G.lobby){body=`<div class="stage" style="text-align:center"><div class="code">${esc(me.code)}</div><p class="sub">${peers.length} here so far${me.host?'. Start when everyone has joined.':'. Waiting for the host to start…'}</p></div>`;
  acts=me.host?`<button class="btn" id="st" style="margin-top:0">Start with ${peers.length} ${peers.length===1?'person':'people'}</button>`:''}
 else if(G.end){body=`<div class="stage" style="text-align:center"><h1>Good night 🌙</h1><p class="sub">Hopefully you learned something new about each other.</p></div>`}
 else{body=cardHTML(G,`${G.who?`🎲 <b>${esc(G.who)}</b> answers first · `:''}${done}/${peers.length} done answering`,gDeep,G.i);
  acts=`<button class="sm" id="dn" style="margin-top:0">${mine?'Undo — still talking':'✓ I\'ve answered'}</button>`;
  if(me.host){acts+=(wantSwap?'<p class="hint">Someone would like a different card 🙂</p>':'')+(G.k==='close'||peers.length<2?'':'<button class="sm" id="rg" style="margin-top:8px">🎲 Pick who answers first</button>')+`<button class="btn" id="nx" style="margin-top:8px">${G.k==='close'?'Finish the night':'Next card →'}</button><button class="btn ghost" id="sw">Swap this card</button>${G.k==='close'?'':'<button class="btn ghost" id="en" style="margin-top:0">End the night with one more question</button>'}`}
  else acts+=(G.k==='close'?'':`<button class="btn ghost" id="np">${passed?'Requested ✓ (tap to undo)':'Not tonight — different card'}</button>`)+`<p class="note">The host moves to the next card.</p>`}
 $('#app').innerHTML=head('← Leave',`Group ${me.code}`)+`<div class="names" style="margin-bottom:6px">${chips}</div>`+body+acts;
 $('#bk').onclick=()=>{leave();home()};
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#dn',()=>R.presence({done:!mine}).catch(()=>{}));
 on('#np',()=>R.presence({pass:!passed}).catch(()=>{}));
 on('#dp',()=>{gDeep=!gDeep;groupView()});
 on('#fv',()=>{togFav(G);groupView()});
 on('#st',()=>setG());
 on('#rg',()=>{const o=peers.map(p=>p.presence.name).filter(x=>x!==G.who);G={...G,who:pick(o)};pushState();groupView()});
 on('#nx',()=>{if(G.k==='close'){G={n:++S.n,end:true};delSess();pushState();groupView()}else{S.i++;setG()}});
 on('#sw',()=>{S.deck.push(S.deck.splice(S.i,1)[0]);setG()});
 on('#en',()=>setG(true));
}
home();
</script>
</body>
</html>
